<!doctype html>
<html lang="en" data-theme="blanc-osmanthe">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azelle — Fragrance Beyond Words</title>
    <meta name="description" content="Niche fragrances composed in small batches." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300..700&family=Cormorant+Garamond:ital,wght@0,300..600;1,300..600&family=Jost:wght@300..600&family=Bodoni+Moda:wght@400..700&family=Space+Grotesk:wght@300..600&family=Cinzel:wght@400..900&display=swap"
    />
    <script>
      // Apply a stored theme before first paint so the default never flashes.
      (function () {
        try {
          var t = localStorage.getItem("azelle.theme");
          if (["blanc-osmanthe", "noir-ambre", "vert-cristal"].indexOf(t) > -1)
            document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
